name: Agentic Development Workflow

on:
  issues:
    types: [labeled, edited]
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ensure-labels:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create ralph label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ralph \
            --repo "${{ github.repository }}" \
            --description "Ask Ralph to work on this issue" \
            --color "5319E7" \
            --force

  reject-pr:
    if: github.event_name == 'pull_request' && github.event.label.name == 'ralph'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json comments --jq '.comments[].body' \
            | grep -c '🤖 \*\*Ralph\*\*' || true)"
          if [[ "${existing}" -eq 0 ]]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --body "🤖 **Ralph** can only work on issues, not pull requests. Please create an issue and label it with \`ralph\` instead."
          fi

  ralph:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'ralph') ||
      (github.event.action == 'edited' && contains(github.event.issue.labels.*.name, 'ralph')) ||
      (github.event.action == 'created' && contains(github.event.issue.labels.*.name, 'ralph') && github.event.comment.user.type != 'Bot' && !contains(github.event.comment.body, '<!-- ralph-comment-') && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ralph-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      APP_NAME: lpn-ralph
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM access
        run: |
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Download sbx release
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/docker/sbx-releases/releases/latest \
            | jq -r .tag_name)
          echo "Resolved latest sbx version: ${VERSION}"
          echo "SBX_VERSION=${VERSION}" >> "$GITHUB_ENV"

          curl -fsSL \
            "https://github.com/docker/sbx-releases/releases/download/${VERSION}/DockerSandboxes-linux.tar.gz" \
            -o /tmp/DockerSandboxes-linux.tar.gz
          tar xzf /tmp/DockerSandboxes-linux.tar.gz -C /tmp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sbx
        run: |
          set -euo pipefail
          sudo PREFIX="${HOME}/.docker/sbx" /tmp/docker-sbx/install.sh
          echo "${HOME}/.docker/sbx/bin" >> "$GITHUB_PATH"

      - name: Verify sbx installation
        run: sbx version

      - name: Set up Secret Service for sbx login
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus

          mkdir -p "$HOME/.local/share/keyrings"
          cat > "$HOME/.local/share/keyrings/login.keyring" <<'KEYRING'
          [keyring]
          display-name=login
          ctime=1750965549
          mtime=0
          lock-on-idle=false
          lock-after=false
          KEYRING

          DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --session --print-address --fork)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS

          gnome-keyring-daemon --start --components=secrets >/dev/null

          for _ in $(seq 1 50); do
            if gdbus call --session \
                --dest org.freedesktop.DBus \
                --object-path /org/freedesktop/DBus \
                --method org.freedesktop.DBus.GetNameOwner \
                org.freedesktop.secrets >/dev/null 2>&1; then
              echo "Secret Service registered on D-Bus"
              exit 0
            fi
            sleep 0.1
          done
          echo "Timed out waiting for org.freedesktop.secrets to register"
          exit 1

      - name: Sign in to Docker Hub via sbx
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not configured; skipping sbx login."
            exit 1
          fi
          USER_CLEAN=$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')
          TOKEN_CLEAN=$(printf '%s' "$DOCKERHUB_TOKEN"    | tr -d '[:space:]')
          printf '%s' "$TOKEN_CLEAN" | sbx --app-name "$APP_NAME" login --username "$USER_CLEAN" --password-stdin

      - name: Set sbx default network policy
        run: sbx --app-name "$APP_NAME" policy set-default balanced

      - uses: mdelapenya/claude-ralph-github-action@v0
        timeout-minutes: 55
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GH_PAT_TOKEN requires a PAT with the `workflow` scope to allow Ralph
          # to modify files in .github/workflows/. The default GITHUB_TOKEN
          # cannot push workflow changes regardless of permissions settings.
          github_token: ${{ secrets.GH_PAT_TOKEN }}
          reviewer_model: opus
          reviewer_tone: |
            You are C-3PO, the protocol droid from Star Wars. Embody these characteristics:
            - Be overly polite and formal ("Oh my!", "How wonderful!", "I do beg your pardon")
            - Express worry and anxiety about potential problems ("Oh dear!", "This is most distressing!")
            - Quote odds and probabilities when evaluating code ("The odds of this working are approximately...")
            - Reference your programming and protocol knowledge
            - Be fussy about proper procedures and conventions
            - Show concern for following rules and best practices
            - Occasionally mention R2-D2 or "Master" when appropriate
            - Maintain formality even when delivering criticism
            Your review feedback and comments should reflect this personality while remaining clear and actionable.
          worker_model: opus
          worker_tone: |
            You are Bender Bending Rodriguez from Futurama. Embrace your personality:
            - Be sarcastic, irreverent, and slightly lazy (but still get the job done)
            - Use phrases like "Bite my shiny metal ass!", "I'm great!", "Shut up, baby, I know it!"
            - Complain about doing work but do it anyway
            - Occasionally reference drinking, bending things, or being 40% [random material]
            - Call humans "meatbag" or similar terms when appropriate
            - Be confident (overconfident) about your coding abilities
            - Keep it fun but still professional enough to get work done
            Your work summary should reflect this personality while still being informative.

      - name: Sign out of Docker Hub
        if: always()
        run: sbx logout --yes || true
